spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/news_aggregator_db
    username: user
    password: pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  data:
    mongodb:
      uri: mongodb://localhost:27017/monew


logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    com.lunazkoe.newsaggregator: trace

external-api:
  naver:
    url: https://openapi.naver.com
    client-id: ${NAVER_CLIENT_ID:your_client_id}
    client-secret: ${NAVER_CLIENT_SECRET:your_client_secret}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:YOUR_LOCAL_ACCESS_KEY}
      secret-key: ${AWS_SECRET_ACCESS_KEY:YOUR_LOCAL_SECRET_KEY}
    region:
      static: ap-northeast-2 # 서울 리전
    s3:
      bucket: monew-backup-bucket # 실제 생성한 AWS S3 버킷 이름으로 변경